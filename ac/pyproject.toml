[project]
name = "ac"
version = "0.1.0"
description = "CLI zum Steuern einer Tuya/SmartLife-Klimaanlage über das lokale Netz"
readme = "README.md"
authors = [
    { name = "maxischmaxi", email = "max@jeschek.dev" }
]
requires-python = ">=3.14"
dependencies = [
    "tinytuya>=1.18.1",
    "typer>=0.26.7",
]

[project.scripts]
ac = "ac:main"

[build-system]
requires = ["uv_build>=0.9.7,<0.10.0"]
build-backend = "uv_build"
