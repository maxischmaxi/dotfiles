# matugen-generierte Farben — wird vom `wallpaper`-Befehl überschrieben
source = ~/.config/hypr/hyprlock-colors.conf

# Alias-Mapping auf das alte Tokyo-Night-Naming (damit der Rest der Config bleibt)
$foreground = $on_background
$blue       = $primary
$cyan       = $secondary
$green      = $primary_fixed
$red        = $error
$magenta    = $tertiary

general {
    no_fade_in = false
    no_fade_out = false
    hide_cursor = true
    grace = 0
    disable_loading_bar = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    contrast = 0.9
    brightness = 0.5
    vibrancy = 0.2
    vibrancy_darkness = 0.1
}

# Day + month
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d. %B")"
    color = $foreground
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 300
    halign = center
    valign = center
}

# Big clock
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $foreground
    font_size = 120
    font_family = JetBrains Mono Extrabold
    position = 0, 200
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text =   $USER
    color = $cyan
    font_size = 16
    font_family = JetBrains Mono
    position = 0, -130
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1
    outer_color = $blue
    inner_color = $background_translucent
    font_color = $foreground
    fade_on_empty = false
    rounding = 12
    check_color = $green
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $magenta
    placeholder_text = <i><span foreground="##c0caf5">Password...</span></i>
    hide_input = false
    position = 0, -220
    halign = center
    valign = center
}
