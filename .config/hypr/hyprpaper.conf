# Wallpaper daemon. Started from hyprland.lua's autostart block.
# Image lives in the repo so it is tracked alongside the config.
#
# Syntax is hyprpaper 0.8+: anonymous `wallpaper {}` blocks. The old
# `preload =` / `wallpaper = mon,path` pair is gone and parses to nothing.

wallpaper {
    # Empty monitor = fallback for every output that has no explicit block.
    monitor =
    path = ~/.config/hypr/nord.png
    # Source is 1920x1080, DP-1 is 3840x2160: same aspect ratio, so cover
    # scales it up without cropping anything away.
    fit_mode = cover
}

splash = false
ipc = true
