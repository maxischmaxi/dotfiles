general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = ~/.config/hypr/scripts/save-workspace.sh && loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})' && ~/.config/hypr/scripts/restore-workspace.sh
}

# Locked-Status via ext-session-lock: hypridle respektiert den Session-Lock
# von selbst (keine Idle-Aktionen, solange hyprlock läuft) — außer man setzt
# avoid_securing.

listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Seit Hyprland 0.56 ist `hyprctl dispatch dpms off` kaputt (wird zu invalidem
# Lua übersetzt); die Dispatcher-Form hl.dsp.dpms({action=...}) funktioniert.
# Aufwachen übernimmt Hyprland selbst: misc:key_press_enables_dpms = true
# (hyprland.lua) schaltet die Displays bei jedem Tastendruck wieder ein.
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}
