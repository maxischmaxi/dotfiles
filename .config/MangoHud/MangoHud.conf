### ==========================================================
### MangoHud Config — Satisfactory (Vulkan + HDR + Wayland)
### ==========================================================

################ PERFORMANCE #################
## FPS-Limiter: 0=unlimited, 60, 120 — umschaltbar mit Shift_L+F1
fps_limit=0,60,120
## low-latency Present Mode
vulkan_present_mode=mailbox

################### VISUAL ###################
## Layout-Preset: -1 = default (wir nutzen individuelle Optionen unten)
preset=-1
## Position
position=top-left
## Schriftgröße
font_size=24
## Transparenz
background_alpha=0.5
alpha=1.0
## Abgerundete Ecken
round_corners=4
## Kompakter Style
hud_compact

### ---- GPU ----
gpu_stats
gpu_temp
gpu_core_clock
gpu_mem_clock
gpu_power
gpu_fan
gpu_load_change
gpu_load_value=60,90

### ---- CPU ----
cpu_stats
cpu_temp
cpu_mhz
cpu_power
cpu_load_change
cpu_load_value=60,90
# core_load
# core_bars

### ---- Memory ----
ram
vram

### ---- FPS & Frametime ----
fps
fps_color_change
fps_value=30,60
frametime
frame_timing
# histogram

### ---- Throttling ----
throttling_status

### ---- Misc Info ----
time
# engine_version
# gpu_name
# vulkan_driver
# wine
present_mode

text_outline

### ---- Graphen (zusätzliche mini-graphs) ----
graphs=gpu_load,cpu_load,gpu_temp,cpu_temp

################ INTERACTION #################
## HUD toggle (default: Shift_R+F12)
# toggle_hud=Shift_R+F12
## Config live neu laden
# reload_cfg=Shift_L+F4

#################### LOG #####################
## Benchmark-Logs hier ablegen
# output_folder=/home/USERNAME/mangologs
# permit_upload=0
