# Generated by matugen — do not edit manually
# Sourced from ~/.config/tmux/tmux.conf at the end (after TPM + user overrides).
# Bei jedem wallpaper-Wechsel: tmux source-file ~/.config/tmux/colors.conf

# ─── Globale Styles ──────────────────────────────────────────────────────────
# OLED: kein Status-Bar-Hintergrund — nur aktives Fenster wird gehighlightet.
set -g status-style "bg=default,fg=#c3c6d3"
set -g status-left-style "default"
set -g status-right-style "default"

set -g message-style "bg=#acc7ff,fg=#002f68"
set -g message-command-style "bg=#acc7ff,fg=#002f68"

set -g pane-border-style "fg=#434751"
set -g pane-active-border-style "fg=#acc7ff"
set -g popup-border-style "fg=#acc7ff"

set -g mode-style "bg=#cbbff8,fg=#322958"

set -g display-panes-active-colour "#acc7ff"
set -g display-panes-colour "#cbbff8"

# ─── status-left: Session-Name + Prefix-Indikator + hostname-widget ──────────
# OLED: kein bg (default), heller fg (primary) bold — keine statischen Pixel.
set -g status-left "#[fg=#acc7ff,bg=default,bold] #{?client_prefix,󰠠 ,#[dim]󰤂 }#[bold,nodim]#S#(/home/max/.config/tmux/plugins/tokyo-night-tmux/src/hostname-widget.sh) "

# ─── Window-Tabs: aktiv = primary-Pill, inaktiv = on_surface_variant ─────────
set -g window-status-current-format "#[fg=#1b2029,bg=#1b2029,nobold,noitalics,nounderscore,nodim]#[fg=#002f68,bg=#acc7ff] #{?#{==:#{pane_current_command},ssh},󰣀 ,}#[fg=#002f68,bold,nodim]#(~/.config/tmux/plugins/tokyo-night-tmux/src/custom-number.sh #I digital)#W#[nobold]#{?window_zoomed_flag, #(~/.config/tmux/plugins/tokyo-night-tmux/src/custom-number.sh #P dsquare),}#{?window_last_flag, , }"
set -g window-status-format "#[fg=#c3c6d3,bg=default,nobold,noitalics,nounderscore,nodim]#[fg=#c3c6d3] #{?#{==:#{pane_current_command},ssh},󰣀 ,}#[fg=#c3c6d3,bg=default,nobold,noitalics,nounderscore,nodim]#(~/.config/tmux/plugins/tokyo-night-tmux/src/custom-number.sh #I digital)#W#[nobold,dim]#{?window_zoomed_flag, #(~/.config/tmux/plugins/tokyo-night-tmux/src/custom-number.sh #P dsquare),} "
set -g window-status-separator ""

# ─── Activity / Bell ─────────────────────────────────────────────────────────
set -g window-status-activity-style "fg=#cbbff8,bg=default"
set -g window-status-bell-style "fg=#ffb4ab,bg=default,bold"
