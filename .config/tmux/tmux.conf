# vim/emacs detection from the pane's foreground process: a format match,
# no ps|grep fork per key press
is_vim='#{m/ri:(^|/)g?(view|l?n?vim?x?)(diff)?$,#{pane_current_command}}'
is_emacs='#{m/ri:^emacs,#{pane_current_command}}'

unbind p
unbind P
unbind n
unbind N
unbind f

unbind C-b
unbind -T root C-b

set -g prefix C-a
bind C-a send-prefix

# Pane navigation without spawning a shell: vim gets the key, otherwise move
# to the neighbour pane. At the edge only emacs gets the key back (it is its
# prefix); nothing is forwarded to Hyprland on purpose.
bind-key -n C-h if -F "$is_vim" { send-keys C-h } { if -F '#{pane_at_left}'   { if -F "$is_emacs" { send-keys C-h } } { select-pane -L } }
bind-key -n C-j if -F "$is_vim" { send-keys C-j } { if -F '#{pane_at_bottom}' { if -F "$is_emacs" { send-keys C-j } } { select-pane -D } }
bind-key -n C-k if -F "$is_vim" { send-keys C-k } { if -F '#{pane_at_top}'    { if -F "$is_emacs" { send-keys C-k } } { select-pane -U } }
bind-key -n C-l if -F "$is_vim" { send-keys C-l } { if -F '#{pane_at_right}'  { if -F "$is_emacs" { send-keys C-l } } { select-pane -R } }
bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'copy-mode'
bind-key -n 'C-n' next-window
bind-key -n 'C-p' previous-window

bind-key -n 'C-S-h' swap-pane -t '{left}'
bind-key -n 'C-S-j' swap-pane -t '{down}'
bind-key -n 'C-S-k' swap-pane -t '{up}'
bind-key -n 'C-S-l' swap-pane -t '{right}'

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi V send-keys -X select-line
bind-key -T copy-mode-vi _ send-keys -X back-to-indentation

# Vim-style text objects in copy-mode: "iw" inner word, "aw" around word
bind-key -T copy-mode-vi i switch-client -T copy-mode-vi-i
bind-key -T copy-mode-vi a switch-client -T copy-mode-vi-a
bind-key -T copy-mode-vi-i w send-keys -X select-word
bind-key -T copy-mode-vi-a w send-keys -X select-word \; send-keys -X cursor-right

bind J run-shell "tmux resize-pane -D $(( $(tmux display -p '#{window_height}') / 5 ))"
bind K run-shell "tmux resize-pane -U $(( $(tmux display -p '#{window_height}') / 5 ))"
bind H run-shell "tmux resize-pane -L $(( $(tmux display -p '#{window_width}') / 5 ))"
bind L run-shell "tmux resize-pane -R $(( $(tmux display -p '#{window_width}') / 5 ))"

bind c new-window -c "#{pane_current_path}"
bind C command-prompt -p "window name:" "new-window -c ~ -n '%%'"
bind N command-prompt -p "session name:" "new-session -c ~ -s '%%'"
bind s choose-tree -Zs
bind v split-window -h -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind b switch-client -l
bind f display-popup -E -w 75% -h 70% "~/dotfiles/tmux-sessionizer"
bind g display-popup -E -w 50% -h 60% "~/dotfiles/tmux-ghostty-shader"

bind-key x kill-pane

bind S setw synchronize-panes \; display "sync: #{?pane_synchronized,on,off}"
bind e capture-pane -p -S - \; save-buffer /tmp/tmux-scroll \; new-window -n scroll "$EDITOR /tmp/tmux-scroll"
bind @ choose-window 'join-pane -h -s "%%"'
bind ! break-pane

set -g renumber-windows on
set -g default-shell /bin/zsh
set -g default-command /bin/zsh
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
set -g pane-border-lines simple
set -g detach-on-destroy off
setw -g mode-keys vi
set-option -g set-clipboard off
set-option -ga update-environment ' WAYLAND_DISPLAY'
set -g allow-passthrough on
set -g extended-keys on
set -g focus-events on
set -g history-limit 100000
set -g display-panes-time 2000

# Nothing in the status bar changes by the second (datetime is off), and every
# tick forks the #() scripts, so 5s is plenty for the Slack indicator.
set-option -g status-interval 5
set-window-option -g automatic-rename on
set-option -g set-titles on

set -g status-left-length 20
set -g status-right-length 150

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tokyo-night-tmux'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'omerxx/tmux-floax'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'schasse/tmux-jump'
set -g @jump-key 'j'

set -g @thumbs-key space
set -g @thumbs-command 'echo -n {} | wl-copy'
set -g @thumbs-upcase-command 'xdg-open {} > /dev/null 2>&1 &'

set -g @extrakto_clip_tool 'wl-copy'
set -g @extrakto_popup_size '80%,60%'

set -g @floax-bind 'p'
set -g @floax-change-path 'true'
set -g @floax-border-color 'default'
set -g @floax-text-color 'default'

set -g extended-keys-format csi-u

set -g @open-S 'https://www.duckduckgo.com/?q='

set -g @tokyo-night-tmux_theme night
set -g @tokyo-night-tmux_transparent 1
set -g @tokyo-night-tmux_window_id_style digital
set -g @tokyo-night-tmux_pane_id_style hsquare
set -g @tokyo-night-tmux_zoom_id_style dsquare

set -g @tokyo-night-tmux_show_datetime 0

run '~/.config/tmux/plugins/tpm/tpm'

# System stats (after TPM to override the theme's status-right). The theme's
# git-status scripts are not included: they exit immediately unless
# @tokyo-night-tmux_show_git / _show_wbg are set to 1.
set -g status-right "#(~/.config/tmux/scripts/sysstat.sh)"

# Window tabs werden in ~/.config/tmux/colors.conf gesetzt (matugen-generiert)

# Override tmux-open's `o`: auto-grab current line, extract first URL, open it
unbind-key -T copy-mode-vi o
bind-key -T copy-mode-vi o send-keys -X start-of-line \; send-keys -X begin-selection \; send-keys -X end-of-line \; send-keys -X copy-pipe-and-cancel "~/.config/tmux/scripts/open-url.sh"

# Override tmux-yank: stay in copy-mode after yanking (after TPM to avoid being overwritten)
set -g @yank_action 'copy-pipe'
bind-key -T copy-mode-vi y send-keys -X copy-pipe "wl-copy"
bind-key -T copy-mode-vi Y send-keys -X copy-pipe "wl-copy"

# Pane navigation inside copy-mode: root bindings don't apply there.
# No is_vim check needed - copy-mode already owns the keyboard.
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# Reload config (after TPM to avoid being overwritten)
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# matugen-generierte Farben (überschreibt Plugin- und User-Defaults).
# Wird vom `wallpaper`-Befehl pro Wallpaper-Wechsel neu geschrieben.
source-file ~/.config/tmux/colors.conf
